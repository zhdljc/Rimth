[package]
name = "Rimth"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.15"
rodio = { version = "0.19", features = ["wav"] }
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "socks", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true